name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: types
        run: uv run mypy src
      - name: tests (unit, planted-fault, recorded-oracle, adapter contracts)
        run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: the bench catches every planted fault
        run: uv run bmr demo --out runs

  servers:
    name: pinned servers still match their snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: uv tool install "biomcp-cli==0.9.1" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run python scripts/snapshot_tools.py --check
