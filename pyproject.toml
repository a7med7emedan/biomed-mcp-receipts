[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "biomed-mcp-receipts"
version = "0.1.0"
description = "Receipts for biomedical MCP tools: checks each server's answers against the primary source, scores seven dimensions and keeps a hash-chained audit trail."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ahmed Hemedan" }]
keywords = [
  "mcp", "model-context-protocol", "mcp-server", "benchmark", "evaluation", "llm-evaluation",
  "ai-agents", "biomedical", "bioinformatics", "clinical-trials", "pubmed", "provenance",
  "audit-trail", "ro-crate", "reproducibility", "data-quality",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "jsonschema>=4.20",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "typer>=0.12",
  "anyio>=4.9",
]

[project.urls]
Homepage = "https://github.com/a7med7emedan/biomed-mcp-receipts"
Issues = "https://github.com/a7med7emedan/biomed-mcp-receipts/issues"

[project.scripts]
bmr = "biomed_mcp_receipts.cli:app"
biomed-mcp-receipts = "biomed_mcp_receipts.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biomed_mcp_receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["biomed_mcp_receipts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
